<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flipside Connector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0b10; color: #ececf3; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: #a3a3b5; margin: 4px 0 20px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c2c3a; background: #15151e; color: inherit; font: inherit; }
    .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; }
    .check small { display: block; color: #a3a3b5; }
    button { margin-top: 20px; padding: 9px 16px; border-radius: 8px; border: 0; background: #7c5cff; color: #fff; font: inherit; cursor: pointer; }
    button.ghost { background: #232333; margin-left: 8px; }
    #status { margin-top: 16px; min-height: 22px; }
    .good { color: #5fd38d; } .bad { color: #ff7a7a; }
  </style>
</head>
<body>
  <main>
    <h1>Flipside Connector</h1>
    <p>Pairs this browser with the Flipside app running on this computer.</p>
    <label for="token">Pairing token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Flipside → Settings → Browser extension → Copy" />
    <div class="check">
      <input id="auto" type="checkbox" />
      <div><label for="auto" style="margin:0">Get albums automatically</label>
        <small>When a page's album is found on Deezer or Usenet, start Auto-get without clicking. Off by default: titles scraped from some sites are fuzzy.</small></div>
    </div>
    <button id="save">Save</button><button id="test" class="ghost">Test connection</button>
    <div id="status" role="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
